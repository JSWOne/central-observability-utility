spring.application.name=demo-boot3
server.port=8080

# Trace correlation filter (opt-in).
jsw.observability.tracing.enabled=true
jsw.observability.tracing.request-header-name=X-Request-ID
jsw.observability.tracing.request-id-mdc-key=requestId

# Request/response logging aspect (opt-in). INFO so every call is visible without raising levels.
jsw.observability.logging.aspect.enabled=true
jsw.observability.logging.aspect.base-packages=com.jswone.demo
jsw.observability.logging.aspect.success-log-level=INFO
jsw.observability.logging.aspect.slow-call-threshold-ms=2000
jsw.observability.logging.aspect.max-rendered-length=2000

# Micrometer meters (including the ErrorEventLogger observation) pushed to the collector.
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
management.otlp.metrics.export.step=5s
management.endpoints.web.exposure.include=health,metrics
